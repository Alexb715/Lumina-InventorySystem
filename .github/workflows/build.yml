name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: LuminaInventorySystem

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qtbase5-dev \
            libmariadb-dev libmariadb-dev-compat \
            libfuse2 file libqt5network5 \
            qtwayland5 libqt5waylandclient5-dev

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            echo "ver=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DAPP_VERSION=${{ steps.version.outputs.ver }}
          cmake --build build --parallel

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications
          cp build/InventorySystem AppDir/usr/bin/
          cp icons/lumina_256.png AppDir/usr/share/icons/hicolor/256x256/apps/lumina.png
          cp icons/lumina_256.png AppDir/lumina.png
          printf '[Desktop Entry]\nName=Lumina_Inventory_System\nExec=InventorySystem\nIcon=lumina\nType=Application\nCategories=Utility;\n' > AppDir/lumina.desktop
          cp AppDir/lumina.desktop AppDir/usr/share/applications/lumina.desktop

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$(which qmake)
          export OUTPUT=LuminaInventorySystem-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls -la *.AppImage
          mv Lumina_Inventory_System*.AppImage "$OUTPUT" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: LuminaInventorySystem-linux-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Install MySQL
        shell: pwsh
        run: |
          choco install mysql -y

      - name: Install OpenSSL 1.1 (for Qt5 Network HTTPS)
        shell: pwsh
        run: |
          choco install openssl --version=1.1.1.2100 -y --no-progress

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            "ver=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            "ver=0.0.0" >> $env:GITHUB_OUTPUT
          }

      - name: Find MySQL paths
        id: mysql
        shell: pwsh
        run: |
          $mysqlDir = Get-ChildItem "C:\Program Files\MySQL\MySQL Server *" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Found MySQL at: $($mysqlDir.FullName)"
          "include=$($mysqlDir.FullName)\include" >> $env:GITHUB_OUTPUT
          "lib=$($mysqlDir.FullName)\lib\libmysql.lib" >> $env:GITHUB_OUTPUT
          "dll=$($mysqlDir.FullName)\lib\libmysql.dll" >> $env:GITHUB_OUTPUT
          "bin=$($mysqlDir.FullName)\bin" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DAPP_VERSION=${{ steps.version.outputs.ver }} ^
            -DMySQL_INCLUDE_DIR="${{ steps.mysql.outputs.include }}" ^
            -DMySQL_LIBRARY="${{ steps.mysql.outputs.lib }}"
          cmake --build build

      - name: Package
        shell: pwsh
        env:
          MYSQL_BIN: ${{ steps.mysql.outputs.bin }}
          MYSQL_DLL: ${{ steps.mysql.outputs.dll }}
        run: |
          mkdir package
          Copy-Item build\InventorySystem.exe package\
          Copy-Item "$env:MYSQL_DLL" package\

          $missing = @()

          # OpenSSL 3 DLLs needed by libmysql.dll (MySQL 8.0+)
          foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
            $src = Join-Path $env:MYSQL_BIN $dll
            if (Test-Path $src) {
              Write-Host "Copying $dll from $env:MYSQL_BIN"
              Copy-Item $src package\
            } else {
              $missing += "$dll (expected at $env:MYSQL_BIN)"
            }
          }

          # OpenSSL 1.1 DLLs needed by Qt5Network.dll (Qt 5.15 HTTPS)
          # Installed by chocolatey openssl 1.1.1.2100 (Shining Light Productions)
          $openssl11Root = "C:\Program Files\OpenSSL-Win64"
          foreach ($dll in @("libssl-1_1-x64.dll", "libcrypto-1_1-x64.dll")) {
            $found = Get-ChildItem -Path $openssl11Root -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "Copying $dll from $($found.DirectoryName)"
              Copy-Item $found.FullName package\
            } else {
              $missing += "$dll (searched under $openssl11Root)"
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required DLLs:`n  $($missing -join "`n  ")"
            exit 1
          }

          windeployqt package\InventorySystem.exe
          Copy-Item icons\lumina_256.png package\lumina.png

      - name: Create ICO from PNG
        shell: pwsh
        run: |
          choco install imagemagick -y
          magick icons\lumina_256.png -define icon:auto-resize=256,128,64,48,32,16 icons\lumina.ico

      - name: Create installer with NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { "0.0.0" }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: LuminaInventorySystem-Setup.exe

  build-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5 via aqt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Install MySQL client
        run: |
          brew install mysql-client pkg-config

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            echo "ver=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          MYSQL_PREFIX="$(brew --prefix mysql-client)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION=${{ steps.version.outputs.ver }} \
            -DMySQL_INCLUDE_DIR="${MYSQL_PREFIX}/include/mysql" \
            -DMySQL_LIBRARY="${MYSQL_PREFIX}/lib/libmysqlclient.dylib"
          cmake --build build --parallel

      - name: Create app bundle and DMG
        run: |
          mkdir -p LuminaInventorySystem.app/Contents/MacOS
          mkdir -p LuminaInventorySystem.app/Contents/Resources
          cp build/InventorySystem LuminaInventorySystem.app/Contents/MacOS/
          cp icons/lumina_256.png LuminaInventorySystem.app/Contents/Resources/lumina.png

          VERSION="1.0.0"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi

          cat > LuminaInventorySystem.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>InventorySystem</string>
            <key>CFBundleName</key>
            <string>Lumina Inventory System</string>
            <key>CFBundleIdentifier</key>
            <string>com.lumina.inventorysystem</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleIconFile</key>
            <string>lumina</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          macdeployqt LuminaInventorySystem.app
          hdiutil create -volname "Lumina Inventory System" \
            -srcfolder LuminaInventorySystem.app \
            -ov -format UDZO \
            LuminaInventorySystem-macos-x86_64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: LuminaInventorySystem-macos-x86_64.dmg

  build-macos-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@5 mysql-client pkg-config
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            echo "ver=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          MYSQL_PREFIX="$(brew --prefix mysql-client)"
          QT_PREFIX="$(brew --prefix qt@5)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION=${{ steps.version.outputs.ver }} \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX}" \
            -DMySQL_INCLUDE_DIR="${MYSQL_PREFIX}/include/mysql" \
            -DMySQL_LIBRARY="${MYSQL_PREFIX}/lib/libmysqlclient.dylib"
          cmake --build build --parallel

      - name: Create app bundle and DMG
        run: |
          mkdir -p LuminaInventorySystem.app/Contents/MacOS
          mkdir -p LuminaInventorySystem.app/Contents/Resources
          cp build/InventorySystem LuminaInventorySystem.app/Contents/MacOS/
          cp icons/lumina_256.png LuminaInventorySystem.app/Contents/Resources/lumina.png

          VERSION="1.0.0"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi

          cat > LuminaInventorySystem.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>InventorySystem</string>
            <key>CFBundleName</key>
            <string>Lumina Inventory System</string>
            <key>CFBundleIdentifier</key>
            <string>com.lumina.inventorysystem</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleIconFile</key>
            <string>lumina</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          QT_PREFIX="$(brew --prefix qt@5)"
          "${QT_PREFIX}/bin/macdeployqt" LuminaInventorySystem.app
          hdiutil create -volname "Lumina Inventory System" \
            -srcfolder LuminaInventorySystem.app \
            -ov -format UDZO \
            LuminaInventorySystem-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-dmg
          path: LuminaInventorySystem-macos-arm64.dmg

  release:
    needs: [build-linux, build-windows, build-macos, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LuminaInventorySystem-linux-x86_64.AppImage
            LuminaInventorySystem-Setup.exe
            LuminaInventorySystem-macos-x86_64.dmg
            LuminaInventorySystem-macos-arm64.dmg
          generate_release_notes: true
